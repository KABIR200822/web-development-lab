<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><style>text{font-family:Arial,Helvetica,sans-serif}.white{fill:#edf3ff;font-size:25px}.green{fill:#86efac;font-size:25px}.muted{fill:#94a3b8;font-size:18px}.headline{fill:#edf3ff;font-size:42px;font-weight:700}.cardhead{fill:#edf3ff;font-size:29px;font-weight:700}.darkhead{fill:#172033;font-size:28px;font-weight:700}.dark{fill:#344054;font-size:20px}</style><rect width="1280" height="800" fill="#111827"/><rect width="1280" height="54" fill="#202938"/><circle cx="28" cy="27" r="7" fill="#f87171"/><circle cx="52" cy="27" r="7" fill="#fbbf24"/><circle cx="76" cy="27" r="7" fill="#34d399"/><text x="640" y="34" text-anchor="middle" class="muted">Terminal — zsh</text><text x="58" y="112" class="green">kabir@MacBook-Air ~ %</text><text x="58" y="158" class="white">Create, push and merge a feature branch</text><text x="58" y="218" class="green">git switch -c feature/about-section</text><text x="58" y="272" class="white">git add about.html</text><text x="58" y="326" class="green">git commit -m &quot;P3: Add about section&quot;</text><text x="58" y="380" class="white">git push -u origin feature/about-section</text><text x="58" y="434" class="green">git switch main</text><text x="58" y="488" class="white">git merge feature/about-section</text></svg>