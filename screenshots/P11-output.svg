<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><style>text{font-family:Arial,Helvetica,sans-serif}.white{fill:#edf3ff;font-size:25px}.green{fill:#86efac;font-size:25px}.muted{fill:#94a3b8;font-size:18px}.headline{fill:#edf3ff;font-size:42px;font-weight:700}.cardhead{fill:#edf3ff;font-size:29px;font-weight:700}.darkhead{fill:#172033;font-size:28px;font-weight:700}.dark{fill:#344054;font-size:20px}</style><rect width="1280" height="800" fill="#eef2f7"/><rect width="1280" height="48" fill="#e2e8f0"/><circle cx="24" cy="24" r="7" fill="#f87171"/><circle cx="48" cy="24" r="7" fill="#fbbf24"/><circle cx="72" cy="24" r="7" fill="#34d399"/><rect x="150" y="11" width="980" height="26" rx="13" fill="#fff"/><text x="640" y="29" text-anchor="middle" class="muted">localhost / practical output</text><rect y="48" width="1280" height="752" fill="#0b1020"/><text x="640" y="145" text-anchor="middle" class="headline">THE STUDENT DAILY</text><text x="640" y="182" text-anchor="middle" class="muted">Technology &amp; Ideas — Web Development Laboratory Edition</text><rect x="60" y="235" width="365" height="430" rx="12" fill="#ffffff"/><text x="84" y="285" class="darkhead">Campus Notes</text><text x="84" y="335" class="dark">Students learn by combining theory with practical experiments.</text><rect x="465" y="235" width="365" height="430" rx="12" fill="#e8edf3"/><text x="489" y="285" class="darkhead">Building for the Web</text><text x="489" y="335" class="dark">Semantic HTML describes content; CSS Grid manages rows and columns.</text><rect x="870" y="235" width="365" height="430" rx="12" fill="#ffffff"/><text x="894" y="285" class="darkhead">Quick Guide</text><text x="894" y="335" class="dark">Flexbox: one direction. Grid: rows and columns.</text></svg>